# Sources du calendrier. Vous pouvez modifier ce fichier directement sur GitHub (icône crayon).
#
# Types de source :
#   ville_csv    fichier CSV des données ouvertes de la Ville (code, gratuit)
#   ics          calendrier iCal (.ics, webcal://, Google Agenda public) (code, gratuit)
#   jsonld       page contenant des données « Event » schema.org (code, gratuit)
#   gancio       agenda Gancio, comme Ask A Punk (code, gratuit)
#   page_ia      page web ordinaire lue par l'IA (demande la clé ANTHROPIC_API_KEY ; petit coût)
#   auto         détecte tout seul le bon format (utilisé pour les calendriers soumis par les salles)
#
# Champs utiles :
#   cle          code de la source, affiché sur le site (voir noms_sources plus bas)
#   actif        false pour désactiver sans effacer
#   lieu         nom de la salle, si la source ne le donne pas (calendrier d'une seule salle)
#   adresse      adresse de la salle (aide à la placer sur la carte)
#   discipline   discipline par défaut (theatre, musique, danse, cirque, humour, cinema, lettres)
#   jours_semaine  jours où la source est relue (0 = lundi … 6 = dimanche). Les autres jours,
#                la dernière lecture est réutilisée. Sert à limiter le coût de l'IA.
#   repeter      jour | mois : l'adresse contient des {jour} {mois_fr} {month_en} {annee} {page}
#
# AVANT LE LANCEMENT PUBLIC : pour les agendas tiers (Sors-tu?, Songkick), lisez leurs conditions
# d'utilisation et demandez une autorisation écrite. Mettez actif: false en attendant si vous préférez.

reglages:
  horizon_jours: 60            # combien de jours à l'avance on collecte
  horizon_complet_jours: 14    # au-delà, le site affiche « liste partielle »
  minimum_evenements: 30       # en dessous, la collecte est jugée ratée et l'ancien calendrier reste en ligne
  max_geolocalisations: 40     # nouvelles salles placées sur la carte par passage (OpenStreetMap)
  max_pages_autre: 80          # pages d'événements lues pour classer les titres ambigus

noms_sources:
  ville:      {nom: "Ville de Montréal", url: "https://montreal.ca/evenements"}
  askapunk:   {nom: "Ask A Punk", url: "https://montreal.askapunk.net/"}
  sorstu:     {nom: "Sors-tu?", url: "https://sorstu.ca/calendrier-spectacles/"}
  songkick:   {nom: "Songkick", url: "https://www.songkick.com/metro-areas/27377-canada-montreal"}
  theatre:    {nom: "sites des théâtres", url: ""}
  salles:     {nom: "sites des salles", url: ""}
  galeries:   {nom: "galeries de l'AGAC", url: "https://www.agac.ca/galeries/"}
  calendrier: {nom: "calendriers des salles", url: ""}
  formulaire: {nom: "propositions du public", url: ""}
  recurrents: {nom: "rendez-vous hebdomadaires vérifiés", url: ""}

sources:
  # ---------- Code seulement (gratuit) ----------
  - nom: Ville de Montréal – événements publics
    cle: ville
    type: ville_csv
    url: https://donnees.montreal.ca/dataset/6a4cbf2c-c9b7-413a-86b1-e8f7081e2578/resource/6decf611-6f11-4f34-bb36-324d804c9bad/download/evenements.csv

  - nom: Ask A Punk (DIY, punk, hardcore)
    cle: askapunk
    type: gancio
    url: https://montreal.askapunk.net
    discipline: musique


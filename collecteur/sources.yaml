  # - nom: Galerie Exemple
  #   cle: calendrier
  #   type: ics
  #   url: https://calendar.google.com/calendar/ical/xxxx%40group.calendar.google.com/public/basic.ics
  #   lieu: Galerie Exemple
  #   adresse: 123 rue Exemple, Montréal
  #   discipline: autre


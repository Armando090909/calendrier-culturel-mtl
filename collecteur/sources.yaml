    type: page_ia
    url: "https://www.songkick.com/metro-areas/27377-canada-montreal/{month_en}-{annee}?page={page}"
    repeter: mois
    mois: 2
    pages: 5
    discipline: musique
    jours_semaine: [0, 3]


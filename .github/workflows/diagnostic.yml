# Diagnostic de pages (outils/diag/urls.txt) : lancé quand cette liste change, résultat dans outils/diag/resultat.json.
name: Diagnostic de pages
on:
  push:
    branches: [main]
    paths: ["outils/diag/urls.txt", "outils/explorer_api.py", "outils/captures.py", "outils/verifier_affiches.py", "outils/contacts.py", "outils/identification.py"]
  workflow_dispatch:
concurrency:
  group: diagnostic
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-24.04  # 11 nov. 2026 : ubuntu-latest est passé à 26.04, dont le serveur de paquets ne répond pas
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt
      - run: pip install -r collecteur/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.48
      - run: python -m playwright install --with-deps chromium || python -m playwright install chromium
      - run: python outils/diag.py
        env:
          CONTACT: ${{ vars.CONTACT }}
      - name: Coordonnées publiques des salles (promotion)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "outils/contacts.py"; then ROBOTS_MODE=respecter python outils/contacts.py || true; fi
      - name: Essai de l'identification Instagram
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "outils/identification.py"; then python outils/identification.py || true; fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      - name: Captures d'écran du site
        run: python outils/captures.py || true
      - name: Affiches qui ne s'affichent pas
        run: python outils/verifier_affiches.py || true
      - name: Essai des API à clé
        run: python outils/explorer_api.py || true
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - run: |
          git config user.name "collecte-automatique"
          git config user.email "actions@users.noreply.github.com"
          git add -A outils/diag
          git commit -m "Diagnostic de pages" && { git pull --rebase -X theirs origin main; git push; } || true

# Publication du site sur GitHub Pages, appelée par la collecte (après l'assemblage, puis après l'enrichissement).
name: Publier le site

on:
  workflow_call:

jobs:
  publier:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      # Version anglaise des pages fixes (docs/en/), refaite à partir des pages françaises
      - name: Pages anglaises
        run: python3 outils/traduire_pages.py
      - name: Polices hébergées sur le site
        run: python3 outils/polices.py
      # Numéro de version sur app.js et style.css : les navigateurs prennent la nouvelle version tout de suite
      - name: Version des fichiers
        run: |
          V=$(date +%Y%m%d%H%M)
          sed -i -E "s#(href|src)=\"((\.\./)?(app\.js|style\.css))(\?v=[0-9]+)?\"#\1=\"\2?v=$V\"#g" docs/*.html docs/en/*.html
          grep -h -o -E '(app|style)[.](js|css)[?]v=[0-9]+' docs/*.html docs/en/*.html | sort -u || true
      # Pages pour Google et les aperçus de partage : une par événement, une par jour, sitemap.xml
      - name: Pages des événements et des jours
        run: python3 outils/pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # GitHub Pages met parfois plus de 10 min (son maximum) à copier les ~8 000 fichiers : on réessaie une fois,
      # et un échec n'est signalé (courriel) que si le site en ligne n'a plus été mis à jour depuis plus d'un jour.
      - id: deploiement
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      - id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      - name: Site en ligne à jour ?
        if: steps.deploiement.outcome == 'failure' && steps.deploiement2.outcome == 'failure'
        run: |
          EN_LIGNE=$(curl -fsS "https://ccmtl.ca/data.json?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('miseAJour',''))" || echo "")
          HIER=$(TZ=America/Toronto date -d yesterday +%F)
          echo "Données en ligne du : ${EN_LIGNE:-inconnu}"
          if [ -z "$EN_LIGNE" ] || [[ "$EN_LIGNE" < "$HIER" ]]; then
            echo "::error::Le site en ligne n'est plus mis à jour depuis le $EN_LIGNE (deux publications ratées)."; exit 1
          fi
          echo "::warning::Publication ratée deux fois (GitHub Pages trop lent), mais le site en ligne date du $EN_LIGNE : la prochaine publication rattrapera."

# Publication hebdomadaire sur les réseaux (outils/publier.py) : le lundi matin, le visuel « Cette semaine sur l'île ».
# Deux renforts plus tard le même jour (GitHub retarde parfois les tâches programmées) : une seule publication par
# semaine et par réseau. À la main : Actions → « Réseaux sociaux » → Run workflow (cocher « essai » pour vérifier
# les connexions sans rien publier).
name: Réseaux sociaux
on:
  schedule:
    - cron: "23 13-21 * * 1"   # lundi, chaque heure de 8 h 23 à 16 h 23 (Montréal, hiver) : la première qui démarre publie
    - cron: "7 13-14 * * 0"    # dimanche 8 h 07 et 9 h 07 : aperçu envoyé pour approbation (toute la journée pour le regarder)
  issue_comment:
    types: [created]           # réponse dans l'avis d'aperçu : consignes appliquées tout de suite
  push:
    branches: [main]
    paths: ["outils/reseaux/demande-essai.txt", "outils/reseaux/demande-test.txt", "outils/reseaux/demande-envoi-apercu.txt"]
    # demande-essai.txt : essai de connexion (rien n'est publié)
    # demande-test.txt : publie pour vrai les seuls formats écrits dans le fichier (ex. instagram_story,facebook_story),
    # ou « tout » pour la publication normale de la semaine
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : vérifier les connexions, sans rien publier"
        type: boolean
        default: true
      forcer:
        description: "Republier même si la semaine est déjà publiée"
        type: boolean
        default: false
      etape:
        description: "publier (lundi) ou apercu (dimanche : sélection envoyée pour approbation)"
        type: string
        default: "publier"
      seulement:
        description: "Test : publier seulement ces formats (ex. instagram_story,facebook_story), sans les noter comme faits"
        type: string
        default: ""
concurrency:
  group: reseaux
  cancel-in-progress: false
jobs:
  publier:
    # réponses dans un avis : seulement celles du propriétaire, dans un avis d'aperçu
    if: github.event_name != 'issue_comment' || (contains(github.event.issue.labels.*.name, 'apercu-reseaux') && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-24.04  # 11 nov. 2026 : ubuntu-latest est passé à 26.04, dont le serveur de paquets ne répond pas
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collecteur/requirements.txt pillow imageio-ffmpeg  # pyyaml, bs4… : identification des comptes
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.48
      - run: python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_SECRETS: ${{ secrets.SECRETS_JETON }}
          BLUESKY_IDENTIFIANT: ${{ secrets.BLUESKY_IDENTIFIANT }}
          BLUESKY_MOT_DE_PASSE: ${{ secrets.BLUESKY_MOT_DE_PASSE }}
          INSTAGRAM_JETON: ${{ secrets.INSTAGRAM_JETON }}
          THREADS_JETON: ${{ secrets.THREADS_JETON }}
          FACEBOOK_JETON: ${{ secrets.FACEBOOK_JETON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          PUBLIER: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.essai)) && 'essai' || 'oui' }}
          FORCER: ${{ inputs.forcer && '1' || '0' }}
          SEULEMENT: ${{ inputs.seulement }}
          ETAPE: ${{ github.event_name == 'issue_comment' && 'consignes' || (github.event.schedule == '7 13-14 * * 0' || inputs.etape == 'apercu') && 'apercu' || '' }}
          NUMERO_AVIS: ${{ github.event.issue.number }}
          COMMENTAIRE: ${{ github.event.comment.body }}
        run: |
          git config user.name "collecte-automatique"
          git config user.email "actions@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = push ] && git diff --name-only HEAD~1 HEAD | grep -q "outils/reseaux/demande-test.txt"; then
            export PUBLIER=oui SEULEMENT="$(head -1 outils/reseaux/demande-test.txt | tr -d ' \r')"
            export SEMAINE_PUBLIER="$(sed -n 2p outils/reseaux/demande-test.txt | tr -d ' \r')"
            # « tout » : la publication normale de la semaine (notée comme faite), lancée à la main
            [ "$SEULEMENT" = tout ] && export SEULEMENT=""
            echo "Test ciblé : $SEULEMENT"
          fi
          # demande-envoi-apercu.txt : envoyer l'aperçu du dimanche tout de suite (rien n'est publié)
          if [ "$GITHUB_EVENT_NAME" = push ] && git diff --name-only HEAD~1 HEAD | grep -q "outils/reseaux/demande-envoi-apercu.txt"; then
            export ETAPE=apercu
            grep -qi forcer outils/reseaux/demande-envoi-apercu.txt && export FORCER=1  # refaire l'aperçu déjà envoyé
          fi
          python outils/publier.py
      - name: Enregistrer
        if: always()
        run: |
          git add outils/reseaux 2>/dev/null || true
          git commit -m "Réseaux : état des publications" && { git pull --rebase -X theirs origin main; git push; } || true

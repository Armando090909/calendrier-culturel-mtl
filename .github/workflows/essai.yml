# Collecte d'essai (13 nov. 2026) : à chaque changement du code de la collecte, les 3 temps tournent en petit
# (3 sources lues, assemblage rapide sur les lectures en cache, enrichissement avec des budgets de 2 pages), en
# environ 10 minutes. Rien n'est enregistré ni publié. Les changements se font sur une branche : on ne les verse
# dans « main » (la vraie collecte) qu'une fois cet essai réussi.
name: Essai de la collecte

on:
  push:
    branches-ignore: [main]
    paths: ["collecteur/*.py", "collecteur/*.yaml", "collecteur/*.json", "outils/sante.py", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt

      - name: Installer
        run: pip install -r collecteur/requirements.txt

      - name: Mémoire du navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.48
      - name: Installer le navigateur
        run: python -m playwright install --with-deps chromium || python -m playwright install chromium

      - name: Tests
        run: python -m unittest discover -s collecteur/tests

      - name: Fichiers de réglages lisibles
        run: |
          python -c "import yaml,json; yaml.safe_load(open('collecteur/sources.yaml')); yaml.safe_load(open('collecteur/recurrents.yaml')); json.load(open('collecteur/corrections.json')); print('ok')"

      - name: "1. Lecture (3 sources : calendrier .ics, page simple, page en JavaScript)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ETAPE_COLLECTE: lecture
          COLLECTE_ESSAI: "1"
          TOUT_RELIRE: "1"
          ESSAI_SOURCES: "^(LESPACEMAKER – événements|Dièse Onze|Centre Segal)$"
        run: timeout 600 python -u collecteur/collecte.py

      - name: "2. Assemblage rapide (toutes les lectures en cache)"
        env:
          ETAPE_COLLECTE: assemblage
          COLLECTE_RAPIDE: "1"
        run: timeout 900 python -u collecteur/collecte.py

      - name: Site assemblé valable
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("docs/data.json"))
          n = len(d["events"])
          print(f"{n} événements, {len(d['expos'])} séries, mis à jour le {d['miseAJour']}")
          assert n > 1000, "trop peu d'événements : l'assemblage a perdu des données"
          assert all(e.get("date") and e.get("titre") and "lieu" in e for e in d["events"]), "événement incomplet"
          EOF

      - name: "3. Enrichissement (budgets de 2 pages, découverte limitée à 3 min)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ETAPE_COLLECTE: assemblage
          COLLECTE_ESSAI: "1"
        run: timeout 1200 python -u collecteur/collecte.py

      - name: Site enrichi valable
        run: |
          python -c "import json; d=json.load(open('docs/data.json')); n=len(d['events']); print(n,'événements'); assert n > 1000"
